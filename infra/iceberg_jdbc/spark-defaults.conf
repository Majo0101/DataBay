# See README.md for tuning defaults and accepted values.
# Spark Connect serves a local[N] engine with no separate executor JVMs.
# The startup script derives settings for:
# - Driver Java heap (not the container memory limit)
# - Shuffle partitions  
# - Parallelism settings
# - And more...
