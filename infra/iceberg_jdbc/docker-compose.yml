name: spark-iceberg

services:
  spark-pg-iceberg:
    build: .
    image: spark-pg-iceberg
    container_name: spark-pg-iceberg
    
    # Set Java heap (GiB) and local worker threads; leave RAM for overhead.
    # Optional tuning overrides retain existing defaults when omitted.
    environment:
      # - SPARK_SHUFFLE_PARTITIONS=48  # Default: 3 * SPARK_CORES
      # - SPARK_BROADCAST_THRESHOLD=10485760  # Bytes; default 104857600; -1 disables
      # - SPARK_MEMORY_FRACTION=0.6   # Default: 0.8
      # - SPARK_STORAGE_FRACTION=0.5  # Default: 0.3
      - SPARK_MEMORY=32      # Driver Java heap in GiB
      - SPARK_CORES=10       # Local worker threads
    
    ports:
      - "4040:4040"   # Spark UI
      - "15002:15002" # Spark Connect

    # Required by Linux Docker Engine; compatible with Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    volumes:
      - iceberg-lakehouse:/lakehouse
      - iceberg-metastore:/metastore/pgdata
      - ../../data/landing:/data/apache  # Repository-owned CSV fixtures/data
    
    # Optional: mount your local notebooks/data
    # - ./notebooks:/home/spark/notebooks
    # - ./data:/home/spark/data
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && nc -z localhost 15002 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  iceberg-lakehouse:
    name: iceberg-lakehouse
  iceberg-metastore:
    name: iceberg-metastore
