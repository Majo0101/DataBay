version: '3.8'

services:
  spark-pg-delta:
    build: .
    container_name: spark-pg-delta
    
    # Set your available RAM and CPU cores here
    # All Spark settings will be calculated automatically
    environment:
      - SPARK_MEMORY=28      # GB of RAM for Spark
      - SPARK_CORES=12       # Number of CPU cores
    
    ports:
      - "4040:4040"   # Spark UI
      - "15002:15002" # Spark Connect
    
    volumes:
      - spark-lakehouse:/lakehouse
      - spark-metastore:/metastore/pgdata
      - C:/landing:/data/apache  # Windows landing folder for CSV files
    
    # Optional: mount your local notebooks/data
    # - ./notebooks:/home/spark/notebooks
    # - ./data:/home/spark/data
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && nc -z localhost 15002 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  spark-lakehouse:
  spark-metastore:
