[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databay"
version = "0.4.0"
description = "Data quality and comparison tooling for lakehouse datasets"
authors = [
    {name = "Marian Bodnar", email = "bodnar.marian@gmail.com"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "pyspark[connect]==4.2.0",
    "pandas>=2.2.0,<3.0.0",
    "python-dotenv",
    "ipython"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require external runtime dependencies",
    "slow: marks long-running tests",
]
